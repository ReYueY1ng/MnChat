name: Linux amd64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      # Flutter Linux 桌面构建的依赖：cmake/ninja-build/clang/pkg-config 是
      # linux/ runner 的构建工具链，libgtk-3-dev 是桌面窗口必需的头文件，
      # liblzma-dev 是 Flutter 官方列出的依赖，libayatana-appindicator3-dev
      # 供 tray_manager 编译托盘支持。sqlite3 走预编译 native asset，无需 C 工具链。
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libayatana-appindicator3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build release bundle (x64)
        run: flutter build linux --release

      # upload-artifact 按 zip 上传，不保留可执行位；桌面产物必须带执行权限，
      # 因此额外打一个 tar.gz 随附上传（解包后 ./mnchat 可直接运行）。
      - name: Package bundle
        run: |
          tar -czf "mnchat-linux-amd64-${{ steps.fvm.outputs.version }}.tar.gz" \
            -C build/linux/x64/release/bundle .

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnchat-linux-amd64-${{ steps.fvm.outputs.version }}
          path: mnchat-linux-amd64-${{ steps.fvm.outputs.version }}.tar.gz
          if-no-files-found: error
