org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Termux 本地构建时（/data/data/com.termux 下的官方 build-tools 是 x86_64，
# 在 aarch64 上无法执行）需取消下面两行的注释；CI / 普通构建保持注释状态。
# android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
# android.enableResourceOptimizations=false
# 显式关闭 IDE 注入的 testOnly 标志。Android Studio / 某些 IDE 触发的构建会
# 传入 android.injected.testOnly=true，AGP 的 ManifestMerger2 随后把
# android:testOnly="true" 写进 manifest，安装器就会拒绝正常安装并提示
# "test only 包"。命令行 `flutter build apk` 默认不注入，这里显式写死
# false 以保证任何触发方式产出的 release 包都可正常安装。
android.injected.testOnly=false
# Force all native modules (incl. plugins) to build only arm64-v8a
android.injected.build.abi=arm64-v8a
