org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Use Termux's native aarch64 aapt2 (official build-tools are x86_64 only)
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
# Disable resource shrinking/optimizations for Termux compatibility
android.enableResourceOptimizations=false
# Force all native modules (incl. plugins) to build only arm64-v8a
android.injected.build.abi=arm64-v8a
